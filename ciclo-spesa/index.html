<title>Ciclo della Spesa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: intestazione fissa con schede; Cruscotto = riepilogo + quattro colonne di fase; la pratica si apre in un pannello laterale (a tutto schermo sul telefono). Lessico visivo della PA italiana: Titillium Web e blu istituzionale. */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#15202d; --muted:#586677; --line:#d6dde6;
  --accent:#0066cc; --accent-strong:#004d99; --accent-soft:#e2edf9; --on-accent:#ffffff;
  --ok:#0a7547; --ok-soft:#e0f2e9; --warn:#975700; --warn-soft:#fbeed9; --bad:#b3261e; --bad-soft:#f8e2e0;
  --scrim:rgba(12,22,34,.42);
  --shadow:0 1px 2px rgba(15,35,60,.06),0 6px 20px rgba(15,35,60,.07);
  --f-ui:"Titillium Web","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#16202b; --surface-2:#1b2632; --ink:#e5ebf2; --muted:#9aa8b8; --line:#2a3746;
  --accent:#5aa2ec; --accent-strong:#86bcf3; --accent-soft:#1a2f47; --on-accent:#08121d;
  --ok:#4cc08d; --ok-soft:#14302a; --warn:#e5a54a; --warn-soft:#352816; --bad:#f07a72; --bad-soft:#3a1d1c;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#16202b; --surface-2:#1b2632; --ink:#e5ebf2; --muted:#9aa8b8; --line:#2a3746;
  --accent:#5aa2ec; --accent-strong:#86bcf3; --accent-soft:#1a2f47; --on-accent:#08121d;
  --ok:#4cc08d; --ok-soft:#14302a; --warn:#e5a54a; --warn-soft:#352816; --bad:#f07a72; --bad-soft:#3a1d1c;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.92em}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

/* intestazione */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:.005em}
.brand small{color:var(--muted);font-size:.8rem}
nav.tabs{display:flex;gap:2px}
nav.tabs a{padding:8px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.85rem}
.banner{padding-block:8px;font-size:.88rem;border-bottom:1px solid var(--line)}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}

main{padding-block:20px 60px}
.section-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.section-h h2{font-size:1.15rem}
.section-h p{margin:0;color:var(--muted);font-size:.9rem}

/* riepilogo */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.stat:hover{border-color:var(--accent)}
.stat .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .val{font-size:1.5rem;font-weight:700;line-height:1.1}
.stat .sub{font-size:.8rem;color:var(--muted)}
.stat.bad .val{color:var(--bad)} .stat.warn .val{color:var(--warn)}

/* bacheca per fasi */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.col-h .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none}
.col-h h3{font-size:1rem}
.col-h .meta{margin-left:auto;text-align:right;font-size:.78rem;color:var(--muted);line-height:1.2}
.col-empty{color:var(--muted);font-size:.86rem;padding:10px 4px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-title{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.card-sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.card-foot{display:flex;align-items:center;gap:8px;font-size:.82rem}
.card-foot .amt{margin-right:auto;font-weight:500}
.prog{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--ok)}

.tag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ex{border-style:dashed}

.attn{margin-top:24px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px;max-width:720px}
.empty h3{font-size:1.1rem}
.empty p{margin:0;color:var(--muted)}
.empty ol{margin:0;padding-left:20px;color:var(--muted)}

/* elenco */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.inp,.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:.9rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.cnt{color:var(--muted);font-size:.86rem;margin:8px 2px}

/* guida */
.guide{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.guide article{max-width:72ch;display:flex;flex-direction:column;gap:18px}
.guide h3{font-size:1.1rem;display:flex;gap:10px;align-items:center}
.guide p{margin:6px 0 0}
.guide .ph{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.guide aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:.9rem}
.guide aside h3{font-size:1rem;margin-bottom:6px}
.terms{display:flex;flex-direction:column;gap:10px}
.terms div{border-top:1px solid var(--line);padding-top:8px}
.terms b{display:block}
.terms span{color:var(--muted)}
.tlist{margin:8px 0 0;padding-left:18px}
.tlist li{margin:3px 0}
.tlist em{font-style:normal;color:var(--muted);font-size:.85em}
details.tipo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
details.tipo summary{cursor:pointer;font-weight:600}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* pannello pratica */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.dr-head .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.dr-head h2{font-size:1.2rem;overflow-wrap:anywhere}
.dr-head .chips{display:flex;gap:6px;flex-wrap:wrap}
.dr-body{overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.box > h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;font-weight:600}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.step{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;border-radius:6px;position:relative;min-width:0}
.step::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--accent)}
.step .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.75rem;font-weight:700;z-index:1;color:var(--muted)}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step .lb{font-size:.76rem;font-weight:600;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.step.sel .lb{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.ph-desc{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--ok)}
.chk .tx{overflow-wrap:anywhere}
.chk .req{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);margin-left:6px}
.chk .ref{grid-column:2;font-size:.8rem;color:var(--muted)}
.chk .by{grid-column:2;font-size:.78rem;color:var(--ok)}
.chk.on .tx{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.warnbox{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:10px}
.warnbox ul{margin:4px 0 8px;padding-left:18px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.8rem;font-weight:600;color:var(--muted)}
.fld .h{font-size:.76rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld.chkf{flex-direction:row;align-items:center;gap:8px}
.fld.chkf input{width:auto}
.form-sub{grid-column:1/-1;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.tipi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;grid-column:1/-1}
.tipi label{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:8px;cursor:pointer;background:var(--surface)}
.tipi label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tipi b{display:block}
.tipi span{font-size:.82rem;color:var(--muted)}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto}
.log li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.86rem}
.log li:first-child{border-top:0}
.log time{color:var(--muted)}
.log .who{color:var(--muted)}
.picker{position:relative}
.picker ul{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.picker li button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:7px 10px;cursor:pointer;text-align:left}
.picker li button:hover{background:var(--accent-soft)}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover}
.who-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.ro .w{display:none!important}

@media (max-width:1020px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.guide{grid-template-columns:minmax(0,1fr)}.guide aside{position:static}}
@media (max-width:620px){.board{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.form,.tipi{grid-template-columns:minmax(0,1fr)}nav.tabs{order:3;width:100%}.log li{grid-template-columns:minmax(0,1fr)}.stepper .lb{font-size:.68rem}.dr-head,.dr-body{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:no-preference){.card,.stat,.btn{transition:border-color .12s,box-shadow .12s,background .12s}}
</style>

<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1>Ciclo della spesa</h1>
      <small>Ordinazione · Liquidazione · Contabilizzazione · Pagamento</small>
    </div>
    <nav class="tabs" aria-label="Sezioni">
      <a href="#cruscotto" data-view="cruscotto">Cruscotto</a>
      <a href="#pratiche" data-view="pratiche">Pratiche</a>
      <a href="#guida" data-view="guida">Guida</a>
    </nav>
    <button class="btn primary w" id="btn-new" type="button">+ Nuova pratica</button>
  </div>
  <div id="banner" hidden></div>
</header>

<main class="wrap" id="main">
  <section id="v-cruscotto"></section>
  <section id="v-pratiche" hidden></section>
  <section id="v-guida" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dr-title"></aside>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ============================================================
   MODELLO: fasi, tipologie, liste di controllo
   ============================================================ */
const FASI = [
  {n:'Ordinazione', d:"Si decide la spesa e si assume l'obbligazione: atto che la autorizza, verifica della copertura sul capitolo e registrazione dell'impegno. Per i contratti pubblici comprende l'acquisizione del CIG e l'ordine al fornitore."},
  {n:'Liquidazione', d:"Si accerta il diritto del creditore: prestazione eseguita e conforme, documento di spesa regolare, importo esatto e beneficiario individuato. Si conclude con l'atto di liquidazione."},
  {n:'Contabilizzazione', d:"La spesa liquidata è registrata nel sistema contabile e sulla Piattaforma dei crediti commerciali (PCC); si emette il titolo di pagamento, che passa al controllo dell'Ufficio centrale di bilancio."},
  {n:'Pagamento', d:"Dopo il controllo il titolo è eseguito dalla tesoreria con accredito al beneficiario. Si registrano data ed estremi della quietanza, si chiudono le comunicazioni e il fascicolo."},
];
const CONCLUSA = 4;

const TIPI = {
  beni:{n:'Beni e servizi', s:'Forniture e servizi con fattura elettronica', check:[
    [
      {id:'b_det', t:'Determina o decisione a contrarre adottata', r:1, ref:'art. 17 D.Lgs. 36/2023'},
      {id:'b_cig', t:'CIG acquisito', r:1, ref:'tracciabilità, art. 3 L. 136/2010'},
      {id:'b_cup', t:'CUP acquisito, se la spesa rientra in un progetto di investimento pubblico', r:0},
      {id:'b_cop', t:'Copertura verificata sul capitolo / piano gestionale', r:1},
      {id:'b_imp', t:'Impegno di spesa registrato nel sistema contabile', r:1, ref:'art. 34 L. 196/2009'},
      {id:'b_ord', t:'Ordine o contratto trasmesso al fornitore (MePA o altro canale)', r:1},
      {id:'b_ccd', t:'Dichiarazione del conto corrente dedicato acquisita', r:0, ref:'art. 3 L. 136/2010'},
    ],[
      {id:'b_fat', t:'Fattura elettronica ricevuta tramite SdI (data di ricezione registrata nei dati)', r:1},
      {id:'b_acc', t:'Fattura accettata, oppure rifiutata con motivazione, entro 15 giorni', r:0, ref:'rifiuto solo nei casi del DM MEF 132/2020'},
      {id:'b_ctr', t:'Controllati in fattura CIG, CUP e codice univoco ufficio', r:1, ref:'art. 25 DL 66/2014'},
      {id:'b_reg', t:'Verifica di conformità / attestazione di regolare esecuzione', r:1},
      {id:'b_durc', t:'DURC regolare e in corso di validità', r:1},
      {id:'b_48b', t:'Verifica inadempimenti presso Agenzia Entrate-Riscossione (pagamenti oltre 5.000 €)', r:0, ref:'art. 48-bis DPR 602/1973'},
      {id:'b_liq', t:'Atto di liquidazione firmato', r:1},
    ],[
      {id:'b_pcc', t:'Fattura contabilizzata su PCC / sistema contabile (liquidata, sospesa o non liquidabile)', r:1},
      {id:'b_spl', t:'Scissione dei pagamenti IVA applicata', r:1, ref:'art. 17-ter DPR 633/1972'},
      {id:'b_op', t:'Ordine di pagamento / titolo di spesa emesso (estremi nei dati)', r:1},
      {id:'b_ucb', t:"Titolo all'Ufficio centrale di bilancio per il controllo", r:1, ref:'D.Lgs. 123/2011'},
    ],[
      {id:'b_vis', t:'Esito positivo del controllo', r:1},
      {id:'b_pag', t:'Pagamento eseguito (data e quietanza nei dati)', r:1},
      {id:'b_pccp', t:'Pagamento risultante su PCC', r:0},
      {id:'b_arc', t:'Fascicolo completato e archiviato; adempimenti di trasparenza verificati', r:1},
    ]
  ]},
  legali:{n:'Spese legali', s:'Spese di lite e onorari da titolo giudiziale', check:[
    [
      {id:'l_tit', t:'Titolo acquisito (sentenza, ordinanza, decreto) e verificata la sua esecutività', r:1},

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',useGrouping:'always'});
const eur = n=>(n==null||n===''||isNaN(n))?'—':EUR.format(n);
const parseNum = s=>{s=String(s??'').trim().replace(/\s|€/g,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=Number(s); return isNaN(n)?NaN:n;};
const numIn = n=>(n==null||isNaN(n))?'':String(n).replace('.',',');
const today = ()=>{const d=new Date(); return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));};
const parseD = s=>{if(!s||typeof s!=='string') return null; const [y,m,d]=s.split('-').map(Number); return (y&&m&&d)?new Date(Date.UTC(y,m-1,d)):null;};
const addDays = (dt,n)=>new Date(dt.getTime()+n*864e5);
const fmtD = dt=>dt?dt.toLocaleDateString('it-IT',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const fmtTs = t=>t?new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const isoD = dt=>dt.toISOString().slice(0,10);
const days = (a,b)=>Math.round((a-b)/864e5);
const faseNome = f=>f>=CONCLUSA?'Conclusa':FASI[f]?.n||'—';

function scadenza(p){
  const m=parseD(p.scadenzaManuale); if(m) return {d:m, base:'indicata a mano'};
  if(p.tipo==='beni'&&parseD(p.dataRicezione)){
    let b=parseD(p.dataRicezione), c=parseD(p.dataConformita); if(c&&c>b) b=c;
    const n=p.termine60?60:30;
    return {d:addDays(b,n), base:`${n} giorni dalla ${c&&c>parseD(p.dataRicezione)?'verifica di conformità':'ricezione della fattura'} (D.Lgs. 231/2002)`};
  }
  if(p.tipo==='legali'&&parseD(p.dataNotifica)) return {d:addDays(parseD(p.dataNotifica),120), base:'120 giorni dalla notifica del titolo esecutivo (art. 14 DL 669/1996)'};
  return null;
}
function residuo(p){ if((p.fase??0)>=CONCLUSA) return null; const s=scadenza(p); return s?days(s.d,today()):null; }
function termineRifiuto(p){
  if(p.tipo!=='beni'||(p.fase??0)>1||p.check?.b_acc?.ok) return null;
  const r=parseD(p.dataRicezione); if(!r) return null;
  return days(addDays(r,15),today());
}
function scadChip(p){
  if((p.fase??0)>=CONCLUSA) return '<span class="chip ok">Conclusa</span>';
  const r=residuo(p), s=scadenza(p); let h='';
  if(p.sospesa) h+='<span class="chip warn">Sospesa</span>';
  if(r==null) return h;
  if(r<0) h+=`<span class="chip bad">Scaduta da ${-r} gg</span>`;
  else if(r<=7) h+=`<span class="chip warn">${r===0?'Scade oggi':`Scade tra ${r} gg`}</span>`;
  else h+=`<span class="chip">Scad. ${fmtD(s.d)}</span>`;
  return h;
}
function avanzamento(p,f=(p.fase??0)){ const l=TIPI[p.tipo]?.check[Math.min(f,3)]||[]; const fatti=l.filter(i=>p.check?.[i.id]?.ok).length; return {fatti,tot:l.length}; }
function mancanti(p,f){ return (TIPI[p.tipo]?.check[f]||[]).filter(i=>i.r&&!p.check?.[i.id]?.ok); }

let toastT;
function toast(m){const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3600);}

const S = {
  mode:'loading', pratiche:new Map(), db:null, user:null, me:null, canWrite:true,
  view:'cruscotto', open:null, newMode:false, viewFase:null, formDirty:false, advWarn:false, delAsk:false, sospAsk:false,

};
const LKEY='ciclo-spesa-pratiche-v1';
function localLoad(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'{}'); return new Map(Object.entries(o));}catch{return new Map();}}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify(Object.fromEntries(S.pratiche)));}catch{toast('Il browser non consente di salvare i dati localmente.');}}
function merge(a,b){const o={...a}; for(const[k,v] of Object.entries(b)){ o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a?.[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))?merge(a[k],v):v; } return o;}

const queues=new Map();
function enqueue(id,fn){const prev=queues.get(id)||Promise.resolve(); const next=prev.then(fn,fn); queues.set(id,next.catch(()=>{})); return next;}

function writeErr(e){
  if(e?.code==='invalid_argument'){ S.canWrite=false; applyRO(); toast('Non hai i permessi per modificare le pratiche: la vista è in sola lettura.'); }
  else if(e?.code==='quota_exceeded') toast("Archivio pieno: elimina le pratiche concluse non più necessarie, poi riprova.");
  else toast('Salvataggio non riuscito. Controlla la connessione e riprova.');
}

async function createPratica(data){
  const now=Date.now();
  const doc={fase:0,check:{},log:[{t:now,by:S.me,m:'Pratica creata'}],creata:now,aggiornata:now,creatoDa:S.me,assegnatario:S.me||null,...data};
  if(S.mode==='db'){
    const ref=S.db.collection('pratiche').doc();
    S.pratiche.set(ref.id,doc); renderAll();
    try{ await ref.set(doc); return ref.id; }catch(e){ S.pratiche.delete(ref.id); renderAll(); writeErr(e); return null; }
  }
  const id='p'+now.toString(36)+Math.random().toString(36).slice(2,6);
  S.pratiche.set(id,doc); localSave(); renderAll(); return id;
}
function save(id,patch,msg){
  const cur=S.pratiche.get(id); if(!cur) return Promise.resolve();
  const now=Date.now(); patch={...patch,aggiornata:now};
  if(msg) patch.log=[...(cur.log||[]),{t:now,by:S.me,m:msg}].slice(-200);
  S.pratiche.set(id,merge(cur,patch)); renderAll();
  if(S.mode==='db') return enqueue(id,()=>S.db.doc('pratiche/'+id).update(patch)).catch(writeErr);
  localSave(); return Promise.resolve();
}
function remove(id){
  S.pratiche.delete(id); closeDrawer(); renderAll();
  if(S.mode==='db') return enqueue(id,()=>S.db.doc('pratiche/'+id).delete()).catch(writeErr);
  localSave(); return Promise.resolve();
}

async function fillNames(root=document){
  const els=$$('[data-uid]',root); if(!els.length) return;
  if(!S.user){ els.forEach(e=>e.textContent=S.mode==='local'?'tu (locale)':'—'); return; }
  const ids=[...new Set(els.map(e=>e.dataset.uid))];
  const ps=await S.user.profiles(ids);
  els.forEach(e=>{const p=ps[e.dataset.uid]; e.textContent=p?.isMe?(p.name?p.name+' (tu)':'tu'):(p?.name||'Collega');});
}

function byUrgency([,a],[,b]){const ra=residuo(a),rb=residuo(b); if(ra==null&&rb==null) return (b.aggiornata||0)-(a.aggiornata||0); if(ra==null) return 1; if(rb==null) return -1; return ra-rb;}
function card([id,p]){
  const a=avanzamento(p); const pct=a.tot?Math.round(a.fatti/a.tot*100):0;

    <div class="card-foot"><span class="amt num">${eur(p.importo)}</span><span class="prog" title="Adempimenti della fase"><i style="width:${pct}%"></i></span><span class="num">${a.fatti}/${a.tot}</span></div>
  </button>`;
}

function filtrate(){
  const f=S.f, q=f.q.trim().toLowerCase();
  return [...S.pratiche].filter(([id,p])=>{
    const fase=p.fase??0, r=residuo(p);
    if(f.tipo&&p.tipo!==f.tipo) return false;
    if(f.fase==='aperte'&&fase>=CONCLUSA) return false;
    if(f.fase!==''&&f.fase!=='aperte'&&String(fase)!==f.fase) return false;
    if(f.stato==='scadute'&&!(r!=null&&r<0)) return false;
    if(f.stato==='inscadenza'&&!(r!=null&&r>=0&&r<=7)) return false;
    if(f.stato==='sospese'&&!p.sospesa) return false;
    if(f.mie&&p.assegnatario!==S.me) return false;
    if(f.eserc&&String(p.esercizio||'')!==f.eserc) return false;
    if(q){const hay=[p.oggetto,p.beneficiario,p.cfpiva,p.cig,p.cup,p.impegno,p.op,p.fattura,p.capitolo,p.titolo,p.rg,p.istituzione,p.note].join(' ').toLowerCase(); if(!hay.includes(q)) return false;}
    return true;
  }).sort(byUrgency);
}

function renderDrawer(full){
  const id=S.open, p=S.pratiche.get(id), d=$('#drawer');
  if(!p){ d.innerHTML=`<div class="dr-head"><div class="t"><h2 id="dr-title">Pratica non più disponibile</h2><p style="margin:0;color:var(--muted)">È stata eliminata da un collega.</p></div><button class="btn ghost" data-act="close" aria-label="Chiudi">✕</button></div>`; return; }
  if(full||!$('#dr-step',d)){
    d.innerHTML=`<div class="dr-head" id="dr-head"></div><div class="dr-body">
      <div class="box"><div id="dr-step"></div></div>
      <div class="box" id="dr-phase"></div>
      <div class="box" id="dr-sit"></div>
      <form class="box" id="dr-form"></form>
      <div class="box"><h3>Cronologia</h3><ul class="log" id="dr-log"></ul></div>
      <div class="box w" id="dr-del"></div></div>`;
  }
  const fase=p.fase??0, s=scadenza(p), r=residuo(p);
  $('#dr-head').innerHTML=`<div class="t"><span class="tag">${esc(TIPI[p.tipo]?.n||'')} · ${faseNome(fase)}</span><h2 id="dr-title">${esc(p.oggetto||'(senza oggetto)')}</h2>
    <div class="chips">${p.esempio?'<span class="chip ex">Esempio</span>':''}${scadChip(p)}<span class="chip num">${eur(p.importo)}</span>${p.beneficiario?`<span class="chip">${esc(p.beneficiario)}</span>`:''}</div></div>
    <button class="btn ghost" data-act="close" aria-label="Chiudi">✕</button>`;

  const vf=S.viewFase??Math.min(fase,3);

    <div class="step ${fase>=CONCLUSA?'done':''}"><span class="dot">${fase>=CONCLUSA?'✓':'●'}</span><span class="lb">Conclusa</span></div></div>`;

  const lst=TIPI[p.tipo]?.check[vf]||[]; const miss=mancanti(p,vf);
  let ph=`<h3>Fase ${vf+1} · ${FASI[vf].n}${vf!==Math.min(fase,3)||fase>=CONCLUSA?' <span class="chip">consultazione</span>':''}</h3><p class="ph-desc">${FASI[vf].d}</p>`;
  ph+=lst.map(it=>{const c=p.check?.[it.id]; const on=!!c?.ok;
    return `<label class="chk ${on?'on':''}"><input type="checkbox" data-chk="${it.id}" ${on?'checked':''} ${S.canWrite?'':'disabled'}><span class="tx">${esc(it.t)}${it.r?'<span class="req">obbligatorio</span>':''}</span>${it.ref?`<span class="ref">${esc(it.ref)}</span>`:''}${on?`<span class="by">Fatto il ${fmtTs(c.at)} da ${whoSpan(c.by)}</span>`:''}</label>`;}).join('');
  if(vf===fase&&fase<CONCLUSA){
    ph+=`<div class="actions w"><button class="btn primary" data-act="adv" type="button">${fase===3?'Concludi la pratica':`Passa a ${FASI[fase+1].n}`}</button>${fase>0?`<button class="btn" data-act="back" type="button">Torna a ${FASI[fase-1].n}</button>`:''}</div>`;
    if(S.advWarn&&miss.length) ph+=`<div class="warnbox w"><b>Mancano ${miss.length} adempimenti obbligatori:</b><ul>${miss.map(i=>`<li>${esc(i.t)}</li>`).join('')}</ul><div class="actions" style="margin-top:0"><button class="btn sm" data-act="adv-force" type="button">Avanza comunque</button><button class="btn sm ghost" data-act="adv-cancel" type="button">Annulla</button></div></div>`;
  }else if(fase>=CONCLUSA&&vf===3){
    ph+=`<div class="actions w"><button class="btn" data-act="reopen" type="button">Riapri in fase Pagamento</button></div>`;
  }
  $('#dr-phase').innerHTML=ph;

  // situazione: scadenze, sospensione, assegnatario
  const rif=termineRifiuto(p);
  let si=`<h3>Situazione</h3><dl class="dl">
    <dt>Scadenza</dt><dd>${s?`<b class="num">${fmtD(s.d)}</b>${r!=null?` · ${r<0?`<span style="color:var(--bad)">scaduta da ${-r} giorni</span>`:r===0?'oggi':`tra ${r} giorni`}`:''}<br><span style="color:var(--muted);font-size:.85rem">${esc(s.base)}</span>`:'<span style="color:var(--muted)">Non calcolabile: inserisci nei dati la data di ricezione su SdI, la notifica del titolo o una scadenza manuale.</span>'}</dd>
    ${rif!=null?`<dt>Esito fattura</dt><dd>${rif<0?`<span style="color:var(--bad)">termine di 15 giorni superato da ${-rif} gg</span>`:`accettare o rifiutare entro ${rif} giorni`}</dd>`:''}
    <dt>Assegnata a</dt><dd><div class="who-row">${whoSpan(p.assegnatario)}${S.user&&S.me?`<span class="w">${p.assegnatario!==S.me?'<button class="btn sm" data-act="me" type="button">Assegna a me</button>':''}${p.assegnatario?'<button class="btn sm ghost" data-act="unassign" type="button">Togli</button>':''}</span>`:''}</div>
      ${S.user&&S.me?`<div class="picker w"><input class="inp" id="as-q" placeholder="Assegna a un collega: scrivi il nome" autocomplete="off" style="width:100%;margin-top:6px"><ul id="as-res" hidden></ul></div>`:''}</dd>
    <dt>Stato</dt><dd>${p.sospesa?`<span class="chip warn">Sospesa</span> ${esc(p.motivoSospensione||'')}`:'Regolare'}</dd>
  </dl>`;
  if(fase<CONCLUSA){
    if(p.sospesa) si+=`<div class="actions w"><button class="btn sm" data-act="riprendi" type="button">Riprendi la pratica</button></div>`;
    else if(S.sospAsk) si+=`<div class="warnbox w"><label for="sosp-m"><b>Motivo della sospensione</b></label><input class="inp" id="sosp-m" style="width:100%;margin:6px 0" placeholder="Es. DURC irregolare, contestazione della fornitura, nota di credito attesa"><div class="actions" style="margin-top:0"><button class="btn sm" data-act="sosp-ok" type="button">Sospendi</button><button class="btn sm ghost" data-act="sosp-no" type="button">Annulla</button></div></div>`;
    else si+=`<div class="actions w"><button class="btn sm" data-act="sosp" type="button">Sospendi la pratica</button></div>`;
  }
  $('#dr-sit').innerHTML=si;

  if(full||!S.formDirty) renderForm(p);

  $('#dr-log').innerHTML=[...(p.log||[])].reverse().map(l=>`<li><time class="num">${fmtTs(l.t)}</time><span>${esc(l.m)} <span class="who">· ${whoSpan(l.by)}</span></span></li>`).join('')||'<li><span>Nessuna attività.</span></li>';
  $('#dr-del').innerHTML=S.delAsk?`<h3>Eliminare la pratica?</h3><p class="ph-desc">L'eliminazione è definitiva per tutti i colleghi e cancella anche la cronologia.</p><div class="actions"><button class="btn danger" data-act="del-ok" type="button">Elimina definitivamente</button><button class="btn" data-act="del-no" type="button">Annulla</button></div>`:`<button class="btn sm danger" data-act="del" type="button">Elimina pratica</button>`;
  fillNames(d);
}

function renderForm(p){
  const f=$('#dr-form'); const ro=S.canWrite?'':'disabled';
  let h='<h3>Dati della pratica</h3><div class="form">';
  for(const c of CAMPI){
    if(c.tipi&&!c.tipi.includes(p.tipo)) continue;
    if(c.sub){ h+=`<div class="form-sub">${c.sub}</div>`; continue; }
    const v=p[c.k]; const idf='fd-'+c.k;
    let inp;
    if(c.t==='area') inp=`<textarea id="${idf}" data-k="${c.k}" ${ro}>${esc(v||'')}</textarea>`;
    else if(c.t==='check') { h+=`<div class="fld chkf full"><input type="checkbox" id="${idf}" data-k="${c.k}" ${v?'checked':''} ${ro}><label for="${idf}">${c.l}</label></div>`; continue; }
    else if(c.t==='num') inp=`<input id="${idf}" data-k="${c.k}" data-t="num" inputmode="decimal" value="${esc(numIn(v))}" ${ro}>`;
    else inp=`<input id="${idf}" data-k="${c.k}" type="${c.t==='date'?'date':'text'}" value="${esc(v||'')}" ${ro}>`;
    h+=`<div class="fld ${c.full?'full':''}"><label for="${idf}">${c.l}</label>${inp}${c.h?`<span class="h">${c.h}</span>`:''}</div>`;
  }
  h+=`</div><div class="actions w"><button class="btn primary" type="submit">Salva i dati</button><span id="form-st" style="color:var(--muted);font-size:.86rem"></span></div>`;
  f.innerHTML=h; S.formDirty=false;
}

function avanza(force){
  const id=S.open, p=S.pratiche.get(id); const fase=p.fase??0; const miss=mancanti(p,fase);
  if(miss.length&&!force){ S.advWarn=true; renderDrawer(); return; }
  const nf=fase+1; S.advWarn=false; S.viewFase=Math.min(nf,3);
  save(id,{fase:nf,sospesa:nf>=CONCLUSA?false:p.sospesa},(nf>=CONCLUSA?'Pratica conclusa':`Passata alla fase ${FASI[nf].n}`)+(miss.length?` con ${miss.length} adempimenti obbligatori non spuntati`:''));
  if(nf>=CONCLUSA) toast('Pratica conclusa.');
}

function csv(){
  const rows=[['Tipologia','Fase','Sospesa','Oggetto','Beneficiario','CF/P.IVA','Importo','IVA','Esercizio','Capitolo','Impegno','CIG','CUP','Fattura','Ricezione SdI','Notifica titolo','Scadenza','Giorni residui','Ordine di pagamento','Data pagamento','Quietanza','Adempimenti fase','Aggiornata']];
  const n=v=>v==null||v===''||isNaN(v)?'':String(v).replace('.',',');
  for(const [,p] of filtrate()){const s=scadenza(p), a=avanzamento(p), r=residuo(p);
    rows.push([TIPI[p.tipo]?.n,faseNome(p.fase??0),p.sospesa?'sì':'',p.oggetto,p.beneficiario,p.cfpiva,n(p.importo),n(p.iva),p.esercizio,p.capitolo,p.impegno,p.cig,p.cup,p.fattura,p.dataRicezione,p.dataNotifica,s?isoD(s.d):'',r??'',p.op,p.dataPagamento,p.quietanza,(p.fase??0)<CONCLUSA?`${a.fatti}/${a.tot}`:'',fmtTs(p.aggiornata)]);}
  const text='﻿'+rows.map(r=>r.map(c=>{c=String(c??''); return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');
  const name=`pratiche-spesa-${isoD(today())}.csv`;
  (async()=>{
    const dl=window.claude?await window.claude.use('downloads').catch(()=>null):null;
    if(dl){ try{ await dl.save({filename:name,data:text}); }catch(e){ if(e?.code!=='declined') toast(e?.code==='rate_limited'?'Una richiesta di salvataggio è già aperta.':'Esportazione non riuscita.'); } return; }
    if(S.mode==='local'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name; a.click(); return; }
    toast("L'esportazione non è disponibile in questa vista.");
  })();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-act],[data-vf],[data-goto],[data-assign]'); if(!t) return;
  if(t.dataset.open){ openDrawer(t.dataset.open); return; }
  if(t.dataset.vf!=null){ S.viewFase=+t.dataset.vf; S.advWarn=false; renderDrawer(); return; }
  if(t.dataset.goto){ const g=t.dataset.goto; S.f={...S.f,fase:g==='concluse'?'4':'aperte',stato:['scadute','inscadenza','sospese'].includes(g)?g:'',eserc:g==='concluse'?String(new Date().getFullYear()):''}; location.hash='pratiche'; return; }
  if(t.dataset.assign){ save(S.open,{assegnatario:t.dataset.assign},'Assegnatario modificato'); return; }
  const id=S.open, p=id&&S.pratiche.get(id);
  switch(t.dataset.act){
    case 'close': closeDrawer(); break;
    case 'new': openNew(); break;
    case 'esempio': esempio(); break;
    case 'adv': avanza(false); break;
    case 'adv-force': avanza(true); break;
    case 'adv-cancel': S.advWarn=false; renderDrawer(); break;
    case 'back': S.advWarn=false; S.viewFase=p.fase-1; save(id,{fase:p.fase-1},`Riportata alla fase ${FASI[p.fase-1].n}`); break;
    case 'reopen': S.viewFase=3; save(id,{fase:3},'Pratica riaperta in fase Pagamento'); break;
    case 'me': save(id,{assegnatario:S.me},'Presa in carico'); break;
    case 'unassign': save(id,{assegnatario:null},'Assegnatario rimosso'); break;
    case 'sosp': S.sospAsk=true; renderDrawer(); $('#sosp-m')?.focus(); break;
    case 'sosp-no': S.sospAsk=false; renderDrawer(); break;
    case 'sosp-ok': { const m=$('#sosp-m').value.trim(); S.sospAsk=false; save(id,{sospesa:true,motivoSospensione:m},'Pratica sospesa'+(m?': '+m:'')); break; }
    case 'riprendi': save(id,{sospesa:false,motivoSospensione:''},'Pratica ripresa'); break;
    case 'del': S.delAsk=true; renderDrawer(); break;
    case 'del-no': S.delAsk=false; renderDrawer(); break;
    case 'del-ok': remove(id); toast('Pratica eliminata.'); break;
  }
});

document.addEventListener('change',e=>{

    save(S.open,{check:{[t.dataset.chk]:t.checked?{ok:true,by:S.me,at:Date.now()}:null}},(t.checked?'Completato: ':'Riaperto: ')+it.t); S.advWarn=false; return; }

});
document.addEventListener('focusin',e=>{ if(e.target.id==='as-q') searchPeople(e.target.value); });
async function searchPeople(q){
  if(!S.user) return; const res=await S.user.search(q); const ul=$('#as-res'); if(!ul) return;
  ul.hidden=!res.length; ul.innerHTML='';
  for(const p of res){ const li=document.createElement('li'); const b=document.createElement('button'); b.type='button'; b.dataset.assign=p.id;
    const img=document.createElement('img'); img.className='av'; img.src=p.avatarUrl; img.alt=''; const sp=document.createElement('span'); sp.textContent=p.name+(p.isMe?' (tu)':'');
    b.append(img,sp); li.append(b); ul.append(li); }
}
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='new-form'){
    const og=$('#n-oggetto').value.trim(); if(!og){ $('#n-oggetto').focus(); toast("Indica l'oggetto della spesa."); return; }
    const imp=parseNum($('#n-imp').value); if(Number.isNaN(imp)){ toast('Importo non valido: usa il formato 1.234,56.'); return; }
    const id=await createPratica({tipo:$('input[name=tipo]:checked').value,oggetto:og,beneficiario:$('#n-benef').value.trim(),importo:imp,esercizio:$('#n-es').value.trim(),capitolo:$('#n-cap').value.trim()});
    if(id) openDrawer(id);
  }
  if(e.target.id==='dr-form'){
    const p=S.pratiche.get(S.open); const patch={}; const changed=[];
    for(const el of $$('[data-k]',e.target)){
      const k=el.dataset.k; let v=el.type==='checkbox'?el.checked:el.dataset.t==='num'?parseNum(el.value):el.value.trim();
      if(Number.isNaN(v)){ el.focus(); toast('Importo non valido: usa il formato 1.234,56.'); return; }
      const old=p[k]??(el.type==='checkbox'?false:el.dataset.t==='num'?null:'');
      if(v!==old){ patch[k]=v; changed.push(CAMPI.find(c=>c.k===k).l); }
    }
    if(!changed.length){ S.formDirty=false; $('#form-st').textContent='Nessuna modifica'; return; }
    S.formDirty=false; await save(S.open,patch,'Dati aggiornati: '+changed.join(', '));
    const st=$('#form-st'); if(st) st.textContent='Salvato';
  }
});

/* ============================================================
   NAVIGAZIONE E AVVIO
   ============================================================ */
function route(){
  const v=['cruscotto','pratiche','guida'].includes(location.hash.slice(1))?location.hash.slice(1):'cruscotto';
  S.view=v; $$('nav.tabs a').forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  ['cruscotto','pratiche','guida'].forEach(k=>$('#v-'+k).hidden=k!==v);
  renderAll(); window.scrollTo(0,0);
}
function renderAll(){
  if(S.view==='cruscotto') renderCruscotto();
  if(S.view==='pratiche') renderPratiche();
  if(S.view==='guida') renderGuida();
  if(S.open&&!$('#drawer').hidden) renderDrawer(false);
}
function banner(kind,html){ const b=$('#banner'); if(!html){b.hidden=true;return;} b.className='banner '+kind; b.innerHTML=`<div class="wrap">${html}</div>`; b.hidden=false; }
function applyRO(){ document.body.classList.toggle('ro',!S.canWrite); if(!S.canWrite) banner('info','Consultazione: puoi vedere le pratiche ma non modificarle.'); }
window.addEventListener('hashchange',route);

function startLocal(){
  S.mode='local'; S.pratiche=localLoad(); S.canWrite=true; applyRO();
  banner('warn','<b>Archivio locale.</b> Le pratiche restano solo in questo browser e non sono condivise con i colleghi.');
  renderAll();
}
async function start(){
  route();
  if(!window.claude){ startLocal(); return; }
  const [db,user]=await Promise.all([window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null)]);
  if(!db){ startLocal(); return; }
  S.db=db; S.user=user;
  if(user){ S.me=await user.id(); const c=await user.can('data.write'); S.canWrite=c!==false; applyRO(); }
  const timer=setTimeout(()=>{ S.unreachable=true; if(S.mode==='loading') renderAll(); else banner('warn',"L'archivio condiviso non risponde: i dati mostrati potrebbero non essere aggiornati."); },10000);
  db.collection('pratiche').onSnapshot(snap=>{
    S.pratiche=new Map(snap.docs.map(d=>[d.id,d.data()]));
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.unreachable=false; if(S.canWrite) banner('',''); }
    S.mode='db'; renderAll();
  },err=>{
    clearTimeout(timer); S.mode='db';
    banner('warn',err.code==='revoked'?'Accesso alle pratiche non più disponibile in questa vista.':"Impossibile leggere l'archivio condiviso. Ricarica la pagina più tardi.");
    renderAll();
  });
}
start();
</script>
